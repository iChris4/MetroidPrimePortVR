name: native-linux

on:
  workflow_dispatch:
  push:
    branches: [port, main, master]
  pull_request:

# Pushes often arrive a few minutes apart; only the newest one's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-18 libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl-dev libfreetype-dev libpng-dev
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-${{ matrix.compiler }}
          # Every save is a new entry (the key gets a timestamp), and the
          # repository's 10 GB of cache is shared: saving from every pull
          # request evicted the Windows and macOS caches within a day or two.
          # Pull requests still restore it. Objects this build did not use are
          # dropped before saving, so an entry holds one build's worth.
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      # Configure downloads and unpacks about a dozen dependencies. Keep the
      # unpacked sources and the stamps that say they are current; the build
      # directories beside them are left out, since ccache covers those.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/native/_deps/*-src
            build/native/_deps/*-subbuild
          key: deps-linux-${{ hashFiles('CMakeLists.txt', 'extern/aurora/**/CMakeLists.txt', 'extern/aurora/**/*.cmake') }}
      - name: Configure
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          if [ "$COMPILER" = gcc ]; then export CC=gcc-14 CXX=g++-14; else export CC=clang-18 CXX=clang++-18; fi
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAURORA_ENABLE_TESTS=ON -DMP_BUILD_TESTS=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      # Build, the port's tests, the TLS log and the GX FIFO regressions.
      - uses: ./.github/actions/build-and-test
        with:
          build-dir: build/native
          jobs: "-j 4"
